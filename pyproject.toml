[project]
name = "agent-memory-auditor"
version = "0.1.0"
description = "Read-only auditor for AI agent memory, skills, and persistent context"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Tyler Delano"}]
keywords = ["ai-agents", "hermes-agent", "memory", "audit", "llm", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["tomli>=2.0.0; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/tylerdotai/agent-memory-auditor"
Repository = "https://github.com/tylerdotai/agent-memory-auditor"
Issues = "https://github.com/tylerdotai/agent-memory-auditor/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5.0", "build>=1.2.0"]

[project.scripts]
memory-audit = "memory_auditor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_auditor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
